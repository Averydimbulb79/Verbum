}
function openFind(){$('findModal').classList.remove('hidden');$('findText').focus()}
$('closeFind').onclick=()=>$('findModal').classList.add('hidden');$('findNext').onclick=()=>{const q=$('findText').value;if(q){ed.focus();window.find?.(q)}};$('replaceAll').onclick=()=>{const a=$('findText').value,b=$('replaceText').value;if(!a)return;const walker=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);let n=0;nodes.forEach(node=>{const parts=node.nodeValue.split(a);if(parts.length>1){n+=parts.length-1;node.nodeValue=parts.join(b)}});changed();alert('Replaced '+n+' occurrence(s).')};
